<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 360px;
      min-height: 400px;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .top-bar h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 11px;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--green);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(18px);
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
    }

    .stat-card .stat-value { font-size: 22px; }
    .stat-card .stat-label { font-size: 10px; }

    .section {
      margin-bottom: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .schedule-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .schedule-row input[type="time"] {
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .schedule-row span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .site-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    .site-item .site-name {
      color: var(--text);
    }

    .site-item .remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .site-item .remove-btn:hover {
      color: var(--red);
    }

    .add-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .add-row .input {
      flex: 1;
      font-size: 12px;
      padding: 6px 10px;
    }

    .add-row .btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    .task-item .task-title { color: var(--text); }

    .task-item .remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .task-item .remove-btn:hover {
      color: var(--red);
    }

    .reset-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🚫 Site Blocker</h1>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggleLabel">On</span>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statCompleted">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statSkipped">0</div>
      <div class="stat-label">Skipped</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statStreak">0</div>
      <div class="stat-label">Day Streak</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Blocked Hours</span>
    </div>
    <div class="schedule-row">
      <input type="time" id="startTime" value="10:00">
      <span>to</span>
      <input type="time" id="endTime" value="17:00">
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Blocked Sites</span>
    </div>
    <div class="site-list" id="siteList"></div>
    <div class="add-row">
      <input type="text" class="input" id="newSiteInput" placeholder="e.g. instagram.com">
      <button class="btn btn-primary" id="addSiteBtn">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Task Queue</span>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="add-row">
      <input type="text" class="input" id="newTaskInput" placeholder="Add a task...">
      <button class="btn btn-primary" id="addTaskBtn">Add</button>
    </div>
  </div>

  <button class="btn btn-danger reset-btn" id="resetBtn">Reset All Stats</button>

  <script src="popup.js"></script>
</body>
</html>
